[package]
name = "tmux-watch"
version = "1.0.0"
edition = "2021"
description = "Deterministic watch/decide split for tmux-driven coding agents"

[[bin]]
name = "tmux-watch"
path = "src/main.rs"

[lib]
name = "tmux_watch"
path = "src/lib.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
